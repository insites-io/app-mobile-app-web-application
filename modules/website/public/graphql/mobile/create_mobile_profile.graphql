mutation create_mobile_profile(
  $id: ID!
  $verification_token: String!
  $is_verified: Boolean
) {
  user_update(
    id: $id
    user: {
      profiles: [
        {
          name: "modules/portal/portal",
          values: {
            properties: [
              { name: "verification_token", value: $verification_token }
              { name: "is_verified", value_boolean: $is_verified }
            ]
          }
        }
      ]
    }
  ) {
    id
  }
}
