mutation update_user_profile(
  $id: ID!
  $first_name: String
  $last_name: String
  $email: String
  $profile_picture_url: String
) {
  user_update(
    id: $id
    user: {
      first_name: $first_name
      last_name: $last_name
      email: $email
      profiles: [
        {
          name: "modules/portal/portal",
          values: {
            properties: [
              { name: "profile_picture_url", value: $profile_picture_url }
            ]
          }
        }
      ]
    }
  ) {
    id
    email
    first_name
    last_name
    external_id
  }
}
